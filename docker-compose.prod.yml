# Production stack: Caddy (HTTPS otomatis) -> Nginx -> PHP-FPM + MySQL 8.4.
# Satu-satunya file yang wajib diisi: `.env` (salin dari `.env.docker.example`).
# Jalankan: docker compose -f docker-compose.prod.yml up -d --build

name: rhapsody

x-app-build: &app-build
  context: .
  target: app

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-rhapsody}
      MYSQL_USER: ${DB_USERNAME:-rhapsody}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Isi DB_PASSWORD di .env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Isi DB_ROOT_PASSWORD di .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p$$MYSQL_ROOT_PASSWORD", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: *app-build
    image: rhapsody-webapp:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Di dalam network compose, database selalu di host `mysql`.
      DB_HOST: mysql
      DB_PORT: 3306
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    volumes:
      - storage-data:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/up"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: *app-build
    image: rhapsody-webapp:latest
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "database", "--tries=3", "--timeout=60", "--sleep=3"]
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    volumes:
      - storage-data:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy

  scheduler:
    build: *app-build
    image: rhapsody-webapp:latest
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    volumes:
      - storage-data:/var/www/html/storage
    depends_on:
      app:
        condition: service_started
      mysql:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_HOST: ${SITE_HOST:?Isi SITE_HOST di .env (domain atau IP VPS)}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro,z
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_started

volumes:
  mysql-data:
  storage-data:
  caddy-data:
  caddy-config:
